<div class="topbar"><h1 class="topbar-title">Delivery fees</h1></div>@if(message){<div class="alert">{{message}}</div>}<div class="dash-form-card"><form [formGroup]="form" (ngSubmit)="save()" class="dash-form"><div class="field"><label>Governorate</label><input formControlName="governorate" placeholder="Governorate"></div><div class="field"><label>Fee (EGP)</label><input type="number" formControlName="fee" min="0"></div><label><input type="checkbox" formControlName="isActive"> Active</label><button class="dash-btn primary">Save fee</button></form></div><div class="dash-table-wrapper"><table class="dash-table"><thead><tr><th>Governorate</th><th>Fee</th><th>Status</th><th>Action</th></tr></thead><tbody>@for(z of zones;track z._id){<tr><td>{{z.governorate}}</td><td>{{z.fee}} EGP</td><td>{{z.isActive?'Active':'Inactive'}}</td><td><button class="action-btn edit" (click)="edit(z)">Edit</button></td></tr>}</tbody></table></div>
